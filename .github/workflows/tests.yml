name: tests

on:
  push:
  pull_request:

# Only the hermetic suite runs here: it stubs the reviewer CLIs, so it needs no provider account and
# no secrets. The e2e suites drive a real Claude session and are a manual pre-release gate.
jobs:
  hermetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh tests/hermetic/*.sh tests/e2e/*.sh
      - name: hermetic suite
        run: bash tests/hermetic/run.sh
